name: Check Codex Reset and Notify Email

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Send a Chinese email test message"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: codex-reset-monitor
  cancel-in-progress: false

jobs:
  check-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check status and notify email
        env:
          QQ_MAIL_USER: ${{ secrets.QQ_MAIL_USER }}
          QQ_MAIL_AUTH_CODE: ${{ secrets.QQ_MAIL_AUTH_CODE }}
          MAIL_TO: 893387818@qq.com
          FORCE_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_notify || 'false' }}
        run: python3 .github/scripts/check-codex-reset-email.py

      - name: Commit updated state
        run: |
          if [ -z "$(git status --porcelain -- .github/state/codex-reset-state.json)" ]; then
            echo "No state change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/state/codex-reset-state.json
          git commit -m "Update Codex reset state"
          git push
